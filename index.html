<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallina Decide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Work+Sans:wght@400;600&display=swap">
<style>
/* Layout: una sola columna centrada, la rueda es el escenario; aspecto de granero de noche (tema único, oscuro) */
:root {
  --barn: #17291f; --barn-2: #22392c; --corn: #f2c230; --red: #c8352b;
  --cream: #f6ead2; --ink: #24170c; --wood: #7a4a22; --muted: #a9b9a6; --blood: #8a0b0e;
  --display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --body: "Work Sans", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(circle at 50% 30%, var(--barn-2), var(--barn) 70%);
  background-color: var(--barn); color: var(--cream); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 8vw, 3.2rem); margin: 0; line-height: 1; color: var(--corn); text-wrap: balance; text-align: center; }
h1 span { color: var(--red); }
p.sub { margin: 0; color: var(--muted); text-align: center; max-width: 42ch; }
label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); align-self: stretch; }
#q { width: 100%; box-sizing: border-box; margin-top: 6px; font: 600 1.05rem var(--body); padding: 10px 12px; border-radius: 8px; border: 2px solid var(--wood); background: var(--barn); color: var(--cream); }
#q:focus-visible, button:focus-visible { outline: 3px solid var(--corn); outline-offset: 2px; }
canvas { width: 100%; max-width: 100%; aspect-ratio: 1; touch-action: manipulation; }
#go { font: 400 1.25rem var(--display); letter-spacing: .02em; padding: 14px 26px; border: 0; border-radius: 999px; background: var(--red); color: var(--cream); cursor: pointer; box-shadow: 0 5px 0 #7d1d16; transition: transform .08s; }
#go:active { transform: translateY(3px); box-shadow: 0 2px 0 #7d1d16; }
#go:disabled { opacity: .55; cursor: wait; }
#out { min-height: 2.6em; text-align: center; font-size: 1.05rem; }
#out b { display: block; font: 400 2.6rem/1 var(--display); }
#out b.si { color: var(--corn); } #out b.no { color: var(--red); }
</style>
</head>
<body>

<main>
  <h1>Gallina <span>Decide</span></h1>
  <p class="sub">Escribe tu pregunta, córtale la cabeza a la gallina y deja que corra por la rueda. Donde caiga, ahí está tu respuesta.</p>
  <label for="q">Tu pregunta
    <input id="q" type="text" value="¿Pido pizza esta noche?" maxlength="80">
  </label>
  <canvas id="c" aria-label="Rueda de SÍ y NO con una gallina"></canvas>
  <button id="go" type="button">SÍ, córtale la cabeza</button>
  <div id="out" aria-live="polite"></div>
</main>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const st = document.createElement('canvas'), sx = st.getContext('2d'); // capa de manchas de sangre que se acumulan
const go = document.getElementById('go'), out = document.getElementById('out'), q = document.getElementById('q');
const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
const C = { corn: v('--corn'), red: v('--red'), cream: v('--cream'), ink: v('--ink'), wood: v('--wood'), blood: v('--blood'),
  plume: '#b8642c', plumeDark: '#6e3416', plumeLight: '#e2a764', tail: '#2e1c10', leg: '#d9a03a', comb: '#d0202a', beak: '#e8b84e' };
const FEATHERS = [C.plume, C.plumeDark, C.plumeLight];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const N = 24, SEG = 2 * Math.PI / N, TAU = 2 * Math.PI;
const norm = a => ((a % TAU) + TAU) % TAU;
const labelAt = a => Math.floor(norm(a) / SEG) % 2 === 0 ? 'SÍ' : 'NO';
console.assert(labelAt(0.01) === 'SÍ' && labelAt(SEG + 0.01) === 'NO' && labelAt(-0.01) === 'NO', 'labelAt');

let S = 0, R = 0, cx = 0;
function resize() {
  S = cv.clientWidth; const d = devicePixelRatio || 1;
  for (const [c, x] of [[cv, ctx], [st, sx]]) { c.width = S * d; c.height = S * d; x.setTransform(d, 0, 0, d, 0, 0); }
  R = S / 2 - 6; cx = S / 2;
}
addEventListener('resize', resize); resize();

// estado
let phase = 'idle', t0 = 0, hasHead = true, head = null, feathers = [], drops = [];
let run = null, pos = { x: 0, y: 0 }, flip = false, step = 0, lastSign = 1, heading = 0, result = null, picked = -1, tilt = 0;

function wheel() {
  for (let i = 0; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(cx, cx); ctx.arc(cx, cx, R, i * SEG, (i + 1) * SEG); ctx.closePath();
    ctx.globalAlpha = picked < 0 || picked === i ? 1 : 0.35;
    ctx.fillStyle = i % 2 ? C.red : C.corn; ctx.fill();
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.save(); ctx.translate(cx, cx); ctx.rotate((i + 0.5) * SEG);
    ctx.fillStyle = i % 2 ? C.cream : C.ink; ctx.font = `${Math.round(S / 30)}px ${v('--display')}`;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(i % 2 ? 'NO' : 'SÍ', R - 8, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(cx, cx, R, 0, TAU); ctx.lineWidth = 6; ctx.strokeStyle = C.wood; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cx, R * 0.2, 0, TAU); ctx.fillStyle = C.wood; ctx.fill();
}

// cabeza en coordenadas locales (unidad = 1/40 del tamaño de la gallina), mirando a la derecha
function drawHead(dead) {
  // cresta dentada
  ctx.beginPath(); ctx.moveTo(-5, -4);
  [[-5, -10], [-3, -7], [-1, -12], [1, -7.5], [3, -12], [5, -7], [7, -10], [7, -4]].forEach(([x, y]) => ctx.lineTo(x, y));
  ctx.closePath(); ctx.fillStyle = C.comb; ctx.fill(); ctx.strokeStyle = 'rgba(60,0,0,.5)'; ctx.lineWidth = .8; ctx.stroke();
  // barbillas
  ctx.fillStyle = C.comb;
  ctx.beginPath(); ctx.ellipse(5, 7, 2.2, 3.6, -0.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(2.5, 6.5, 1.8, 3, 0.2, 0, TAU); ctx.fill();
  // cabeza
  const g = ctx.createRadialGradient(-1, -2, 1, 0, 0, 7.5);
  g.addColorStop(0, C.plumeLight); g.addColorStop(1, C.plume);
  ctx.beginPath(); ctx.ellipse(0, 0, 7, 6.2, 0, 0, TAU); ctx.fillStyle = g; ctx.fill();
  // cara roja desnuda
  ctx.beginPath(); ctx.ellipse(3, 0.5, 3.6, 3.2, 0, 0, TAU); ctx.fillStyle = '#d8423c'; ctx.fill();
  // pico curvo
  ctx.beginPath(); ctx.moveTo(5.8, -2.2); ctx.quadraticCurveTo(11, -1.8, 12.5, 1.2); ctx.quadraticCurveTo(9, 0.6, 5.8, 1.8); ctx.closePath();
  ctx.fillStyle = C.beak; ctx.fill(); ctx.strokeStyle = '#8a6420'; ctx.lineWidth = .6; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, 0); ctx.lineTo(10.5, 0.4); ctx.stroke();
  // ojo
  if (dead) {
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(1.4, -3); ctx.lineTo(4.4, 0); ctx.moveTo(4.4, -3); ctx.lineTo(1.4, 0); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(3, -1.4, 1.7, 0, TAU); ctx.fillStyle = '#e08a1e'; ctx.fill();
    ctx.beginPath(); ctx.arc(3.3, -1.4, 0.9, 0, TAU); ctx.fillStyle = '#111'; ctx.fill();
    ctx.beginPath(); ctx.arc(3.7, -1.9, 0.35, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill();
  }
  // corte del cuello (lado izquierdo de la cabeza suelta)
  if (dead) { ctx.beginPath(); ctx.ellipse(-4, 5, 2.6, 1.6, 0.6, 0, TAU); ctx.fillStyle = C.blood; ctx.fill(); }
}

function chicken(x, y, s, o) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.tilt || 0); ctx.scale((o.flip ? -1 : 1) * s / 40, s / 40);
  const k = Math.sin(o.step) * 6;
  // patas con dedos
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [hx, fx] of [[-3, -3 + k], [5, 5 - k]]) {
    ctx.strokeStyle = C.leg; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(hx, 9); ctx.lineTo(fx, 22); ctx.stroke();
    ctx.lineWidth = 1.6; ctx.beginPath();
    ctx.moveTo(fx, 22); ctx.lineTo(fx + 6, 24.5); ctx.moveTo(fx, 22); ctx.lineTo(fx + 3, 25.5); ctx.moveTo(fx, 22); ctx.lineTo(fx - 4, 23.5); ctx.stroke();
    if (!o.head) { ctx.fillStyle = C.blood; ctx.beginPath(); ctx.ellipse(fx + 1, 24, 3, 1.2, 0, 0, TAU); ctx.fill(); }
  }
  // cola: plumas curvas oscuras con brillo verdoso
  for (let i = 0; i < 6; i++) {
    ctx.save(); ctx.translate(-13, -3); ctx.rotate(-2.2 + i * 0.22);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(9, -4, 16 - i, 1); ctx.quadraticCurveTo(8, 2.5, 0, 0);
    ctx.fillStyle = i % 2 ? C.tail : '#203226'; ctx.fill(); ctx.restore();
  }
  // cuerpo con degradado
  const g = ctx.createRadialGradient(2, -4, 2, 0, 2, 22);
  g.addColorStop(0, C.plumeLight); g.addColorStop(0.55, C.plume); g.addColorStop(1, C.plumeDark);
  ctx.beginPath(); ctx.moveTo(-16, -2);
  ctx.bezierCurveTo(-16, -14, 8, -14, 14, -6);
  ctx.bezierCurveTo(20, 2, 14, 15, 0, 15);
  ctx.bezierCurveTo(-12, 15, -17, 8, -16, -2); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  // escamas de plumas en pecho y lomo
  ctx.strokeStyle = 'rgba(60,24,8,.35)'; ctx.lineWidth = .8;
  for (let r = 0; r < 3; r++) for (let c = 0; c < 5; c++) {
    const px = -8 + c * 5 + (r % 2) * 2.5, py = -6 + r * 6;
    ctx.beginPath(); ctx.arc(px, py, 2.6, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  // cuello con plumas doradas (gola)
  const ng = ctx.createLinearGradient(8, -26, 12, -4);
  ng.addColorStop(0, C.plumeLight); ng.addColorStop(1, C.plume);
  ctx.beginPath(); ctx.moveTo(5, -8); ctx.quadraticCurveTo(7, -18, 10, -21); ctx.lineTo(17, -20); ctx.quadraticCurveTo(18, -10, 15, -4); ctx.closePath();
  ctx.fillStyle = ng; ctx.fill();
  ctx.strokeStyle = 'rgba(110,52,22,.5)';
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(9 + i * 2, -18); ctx.lineTo(7 + i * 2.2, -9); ctx.stroke(); }
  // ala con primarias
  ctx.save(); ctx.translate(-4, 0); ctx.rotate(Math.sin(o.flap) * 0.55);
  ctx.beginPath(); ctx.moveTo(-6, -4); ctx.bezierCurveTo(4, -9, 14, -3, 10, 3); ctx.bezierCurveTo(4, 8, -6, 8, -10, 5); ctx.closePath();
  ctx.fillStyle = C.plumeDark; ctx.fill();
  ctx.strokeStyle = 'rgba(20,8,2,.5)'; ctx.lineWidth = .9;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-2 + i * 3, -3); ctx.quadraticCurveTo(-4 + i * 3, 2, -8 + i * 2.5, 5.5); ctx.stroke(); }
  ctx.restore();
  if (o.head) { ctx.save(); ctx.translate(14, -25); drawHead(false); ctx.restore(); }
  else {
    // muñón: carne roja, centro oscuro y hueso
    ctx.beginPath(); ctx.ellipse(13.5, -21, 4, 2.2, 0, 0, TAU); ctx.fillStyle = C.red; ctx.fill();
    ctx.beginPath(); ctx.ellipse(13.5, -21, 2.4, 1.2, 0, 0, TAU); ctx.fillStyle = C.blood; ctx.fill();
    ctx.beginPath(); ctx.arc(13.5, -21.2, 0.8, 0, TAU); ctx.fillStyle = '#efe3cf'; ctx.fill();
    // chorro que gotea por el cuello
    ctx.fillStyle = C.blood; ctx.beginPath(); ctx.moveTo(15, -21); ctx.quadraticCurveTo(17, -14, 15.5, -8); ctx.lineTo(14.5, -8); ctx.quadraticCurveTo(15.5, -14, 13, -20); ctx.fill();
  }
  ctx.restore();
}

// punto local de la gallina -> coordenadas del canvas
function toWorld(lx, ly, s) {
  const px = (flip ? -1 : 1) * lx * s / 40, py = ly * s / 40;
  return { x: pos.x + px * Math.cos(tilt) - py * Math.sin(tilt), y: pos.y + px * Math.sin(tilt) + py * Math.cos(tilt) };
}

function burst(x, y, n) {
  for (let i = 0; i < n; i++) feathers.push({ x, y, vx: (Math.random() - .5) * 220, vy: -Math.random() * 200, r: Math.random() * TAU, life: 1, c: FEATHERS[i % 3] });
}
function spurt(x, y, n, dir, ground, s) {
  for (let i = 0; i < n; i++) {
    const a = dir + (Math.random() - .5) * 0.9, sp = 120 + Math.random() * 200;
    drops.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, ground: ground + (Math.random() - .3) * s * 0.5, r: s * (0.025 + Math.random() * 0.04) });
  }
}
function stain(x, y, r) {
  sx.fillStyle = C.blood; sx.globalAlpha = 0.8;
  sx.beginPath(); sx.ellipse(x, y, r * 1.4, r, Math.random() * TAU, 0, TAU); sx.fill();
  for (let i = 0; i < 3; i++) if (Math.random() < 0.5) { sx.beginPath(); sx.arc(x + (Math.random() - .5) * r * 6, y + (Math.random() - .5) * r * 4, r * 0.35, 0, TAU); sx.fill(); }
  sx.globalAlpha = 1;
}
function footprint(x, y, ang, s) {
  sx.save(); sx.translate(x, y); sx.rotate(ang); sx.globalAlpha = 0.7;
  sx.strokeStyle = C.blood; sx.lineWidth = s * 0.035; sx.lineCap = 'round';
  const L = s * 0.16; sx.beginPath();
  sx.moveTo(0, 0); sx.lineTo(L, 0); sx.moveTo(0, 0); sx.lineTo(L * 0.8, -L * 0.5); sx.moveTo(0, 0); sx.lineTo(L * 0.8, L * 0.5); sx.moveTo(0, 0); sx.lineTo(-L * 0.4, 0);
  sx.stroke(); sx.restore();
}

function start() {
  if (phase !== 'idle') return;
  phase = 'chop'; t0 = performance.now(); go.disabled = true; out.textContent = '';
}
function reset() {
  phase = 'idle'; hasHead = true; head = null; feathers = []; drops = []; result = null; picked = -1; tilt = 0; pos = { x: cx, y: cx };
  sx.clearRect(0, 0, S, S);
  go.textContent = 'SÍ, córtale la cabeza'; out.textContent = '';
}
go.addEventListener('click', () => phase === 'done' ? reset() : start());

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const s = S / 10, el = (now - t0) / 1000;
  let flap = now / 400;
  ctx.clearRect(0, 0, S, S); wheel(); ctx.drawImage(st, 0, 0, S, S);

  if (phase === 'idle') { pos = { x: cx, y: cx - s * 0.1 + Math.sin(now / 300) * 2 }; step = 0; }
  if (phase === 'chop' && el > 0.28 && hasHead) {
    hasHead = false;
    const n = toWorld(14, -25, s);
    head = { x: n.x, y: n.y, vx: (Math.random() < .5 ? -1 : 1) * (120 + Math.random() * 80), vy: -380, rot: 0, vr: 12, land: cx + s * (0.4 + Math.random() * 0.4), pool: 0 };
    burst(n.x, n.y, 14);
    spurt(n.x, n.y, 30, -Math.PI / 2, pos.y + s * 0.6, s);
  }
  if (phase === 'chop' && el > 0.65) {
    // la respuesta sale de Math.random: segmento al azar y punto dentro de él lejos del borde
    const target = (Math.floor(Math.random() * N) + 0.15 + Math.random() * 0.7) * SEG;
    const a0 = Math.random() * TAU;
    run = { a0, delta: norm(target - a0) + TAU * (2 + Math.floor(Math.random() * 2)), D: reduce ? 1.8 : 5.5, t: now, target };
    phase = 'run';
  }
  if (phase === 'run') {
    const u = Math.min(1, (now - run.t) / 1000 / run.D), e = 1 - Math.pow(1 - u, 3);
    const a = run.a0 + run.delta * e + 0.7 * Math.sin(u * 19) * (1 - u); // corre a lo loco, adelante y atrás
    const r = R * 0.62 * Math.min(1, u / 0.1) + R * 0.06 * Math.sin(u * 27) * (1 - u);
    const nx = cx + Math.cos(a) * r, ny = cx + Math.sin(a) * r;
    if (Math.abs(nx - pos.x) > 0.3) flip = nx < pos.x;
    if (Math.hypot(nx - pos.x, ny - pos.y) > 0.2) heading = Math.atan2(ny - pos.y, nx - pos.x);
    pos = { x: nx, y: ny }; step += dt * 26 * (1 - u * 0.7); flap = now / 60;
    // cada vez que apoya un pie deja una huella de sangre
    const sign = Math.sign(Math.sin(step));
    if (sign !== lastSign) {
      lastSign = sign; const k = Math.sin(step) * 6;
      const f = toWorld(sign > 0 ? -3 + k : 5 - k, 23, s);
      footprint(f.x, f.y, heading, s);
    }
    if (Math.random() < 0.08) burst(nx, ny, 1);
    if (u >= 1) {
      phase = 'done'; t0 = now; result = labelAt(run.target); picked = Math.floor(norm(run.target) / SEG);
      const qt = q.value.trim();
      out.innerHTML = `${qt ? qt.replace(/[<>&]/g, '') + '<br>' : ''}La gallina dice: <b class="${result === 'SÍ' ? 'si' : 'no'}">${result}</b>`;
      go.textContent = 'Otra gallina'; go.disabled = false;
    }
  }
  if (phase === 'done') tilt = Math.min(1, el / 0.4) * (flip ? -1 : 1) * Math.PI / 2;

  // el cuello sin cabeza bombea sangre a latidos; se apaga poco a poco al caer
  if (!hasHead) {
    const power = phase === 'done' ? Math.max(0, 1 - el / 3) : 1;
    if (Math.sin(now / 110) > 0.2 && Math.random() < power) {
      const n = toWorld(13.5, -21, s);
      spurt(n.x, n.y, 2, -Math.PI / 2 + tilt + (flip ? -0.5 : 0.5), pos.y + s * 0.6, s);
    }
  }

  if (head) {
    if (head.y < head.land || head.vy < 0) {
      head.vy += 1400 * dt; head.x += head.vx * dt; head.y += head.vy * dt; head.rot += head.vr * dt;
      if (Math.random() < 0.6) drops.push({ x: head.x, y: head.y, vx: 0, vy: 0, ground: head.land + s * 0.15, r: s * 0.03 });
    } else { head.y = head.land; head.vr = 0; head.pool = Math.min(s * 0.35, head.pool + dt * s * 0.08); }
    head.x = Math.max(s * 0.4, Math.min(S - s * 0.4, head.x));
    if (head.pool) { ctx.fillStyle = C.blood; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.ellipse(head.x - s * 0.08, head.y + s * 0.12, head.pool, head.pool * 0.5, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1; }
    ctx.save(); ctx.translate(head.x, head.y); ctx.rotate(head.rot); ctx.scale(s / 40, s / 40); drawHead(true); ctx.restore();
  }

  chicken(pos.x, pos.y, s, { flip, head: hasHead, step, tilt, flap });

  if (phase === 'chop') {
    const k = Math.min(1, el / 0.28), up = el > 0.4 ? (el - 0.4) / 0.25 : 0;
    const n = toWorld(14, -22, s), bx = n.x, by = n.y - (1 - k) * s * 1.6 - up * s * 1.6;
    ctx.save(); ctx.globalAlpha = 1 - Math.min(1, up); ctx.translate(bx, by);
    const bg = ctx.createLinearGradient(0, -s * 0.55, 0, 0); bg.addColorStop(0, '#9aa1a8'); bg.addColorStop(1, '#e3e7ea');
    ctx.fillStyle = bg; ctx.strokeStyle = C.ink; ctx.lineWidth = 2;
    ctx.fillRect(-s * 0.5, -s * 0.55, s * 0.9, s * 0.55); ctx.strokeRect(-s * 0.5, -s * 0.55, s * 0.9, s * 0.55);
    if (el > 0.28) { ctx.fillStyle = C.blood; ctx.fillRect(-s * 0.5, -s * 0.08, s * 0.9, s * 0.08); }
    ctx.fillStyle = C.wood; ctx.fillRect(s * 0.4, -s * 0.42, s * 0.6, s * 0.18);
    ctx.restore();
  }

  // gotas en el aire: al tocar el suelo se convierten en mancha permanente
  ctx.fillStyle = C.blood;
  for (const d of drops) {
    d.vy += 1200 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
    if (d.vy > 0 && d.y >= d.ground) { stain(d.x, d.ground, d.r); d.done = true; continue; }
    ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * 1.5, Math.atan2(d.vy, d.vx) + Math.PI / 2, 0, TAU); ctx.fill();
  }
  drops = drops.filter(d => !d.done);

  for (const f of feathers) {
    f.vy += 300 * dt; f.vx *= 0.98; f.x += f.vx * dt; f.y += f.vy * dt * 0.4; f.r += dt * 4; f.life -= dt * 0.7;
    ctx.save(); ctx.globalAlpha = Math.max(0, f.life); ctx.translate(f.x, f.y); ctx.rotate(f.r);
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.12, s * 0.04, 0, 0, TAU); ctx.fillStyle = f.c; ctx.fill(); ctx.restore();
  }
  feathers = feathers.filter(f => f.life > 0);
  requestAnimationFrame(frame);
}
pos = { x: cx, y: cx };
requestAnimationFrame(frame);
